[package]
name = "claude-usage"
version = "0.3.0"
edition = "2021"
description = "Read Claude usage from Claude Desktop's local history file, or the OAuth API"

[dependencies]
security-framework = "3"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
reqwest = { version = "0.12", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
