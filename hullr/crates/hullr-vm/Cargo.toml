[package]
name = "hullr-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "macOS Linux VM (Virtualization.framework) host, socket bridge, port forwarding and guest agent for hullr"

[dependencies]
hullr-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSString",
    "NSURL",
] }
objc2-virtualization = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "dispatch2",
    "VZBootLoader",
    "VZLinuxBootLoader",
    "VZVirtualMachine",
    "VZVirtualMachineConfiguration",
    "VZPlatformConfiguration",
    "VZStorageDeviceConfiguration",
    "VZVirtioBlockDeviceConfiguration",
    "VZStorageDeviceAttachment",
    "VZDiskImageStorageDeviceAttachment",
    "VZNetworkDeviceConfiguration",
    "VZVirtioNetworkDeviceConfiguration",
    "VZNetworkDeviceAttachment",
    "VZNATNetworkDeviceAttachment",
    "VZEntropyDeviceConfiguration",
    "VZVirtioEntropyDeviceConfiguration",
    "VZMemoryBalloonDeviceConfiguration",
    "VZVirtioTraditionalMemoryBalloonDeviceConfiguration",
    "VZSerialPortConfiguration",
    "VZVirtioConsoleDeviceSerialPortConfiguration",
    "VZSerialPortAttachment",
    "VZFileSerialPortAttachment",
    "VZSocketDeviceConfiguration",
    "VZVirtioSocketDeviceConfiguration",
    "VZSocketDevice",
    "VZVirtioSocketDevice",
    "VZVirtioSocketConnection",
    "VZDirectorySharingDeviceConfiguration",
    "VZVirtioFileSystemDeviceConfiguration",
    "VZDirectoryShare",
    "VZMultipleDirectoryShare",
    "VZSharedDirectory",
    "VZLinuxRosettaDirectoryShare",
] }

[dev-dependencies]
tempfile.workspace = true
