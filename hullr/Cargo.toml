[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
hullr-core = { path = "crates/hullr-core" }
hullr-image = { path = "crates/hullr-image" }
hullr-build = { path = "crates/hullr-build" }
hullr-compose = { path = "crates/hullr-compose" }
hullr-runtime = { path = "crates/hullr-runtime" }
hullr-vm = { path = "crates/hullr-vm" }
hullr-engine = { path = "crates/hullr-engine" }
hullr-api = { path = "crates/hullr-api" }
hullr-tui = { path = "crates/hullr-tui" }
hullr-gui = { path = "crates/hullr-gui" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs", "process", "signal"] }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
flate2 = "1"
zstd = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
nix = { version = "0.29", features = ["sched", "mount", "process", "signal", "user", "fs", "hostname", "term", "ioctl", "dir", "poll"] }
libc = "0.2"
indexmap = { version = "2", features = ["serde"] }
rand = "0.8"
ratatui = "0.29"
crossterm = "0.28"
eframe = "0.31"
tempfile = "3"
dirs = "5"
